name: Nightly ETL
on:
  schedule:
    - cron: "0 6 * * *"  # 6:00 AM UTC daily
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt

      # Freedom House ETL
      - name: Load Freedom House data
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_ADMIN_USER: ${{ secrets.DB_ADMIN_USER }}
          DB_ADMIN_PW: ${{ secrets.DB_ADMIN_PW }}
        run: python etl/load_freedom_house.py
        continue-on-error: true

      # World Bank WGI ETL
      - name: Load World Bank WGI data
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_ADMIN_USER: ${{ secrets.DB_ADMIN_USER }}
          DB_ADMIN_PW: ${{ secrets.DB_ADMIN_PW }}
        run: python etl/load_world_bank_wgi.py
        continue-on-error: true

      # Transparency International CPI ETL
      - name: Load Transparency International CPI data
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_ADMIN_USER: ${{ secrets.DB_ADMIN_USER }}
          DB_ADMIN_PW: ${{ secrets.DB_ADMIN_PW }}
        run: python etl/load_transparency_cpi.py
        continue-on-error: true

      # International IDEA GSoD ETL
      - name: Load International IDEA GSoD data
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_ADMIN_USER: ${{ secrets.DB_ADMIN_USER }}
          DB_ADMIN_PW: ${{ secrets.DB_ADMIN_PW }}
        run: python etl/load_gsod.py
        continue-on-error: true
